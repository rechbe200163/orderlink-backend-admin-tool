services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  nest-api:
    container_name: nest-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HUSKY: 0
    environment:
      - NODE_ENV=production
    ports:
      - '3001:3001'
    depends_on:
      - redis
    restart: unless-stopped
    env_file:
      - .env.production
volumes:
  redis-data:
  minio-data:
